# Nginx สำหรับ Cloudflare Proxy (ส้ม cloud เปิด)
# ติดตั้ง:
#   sudo cp deploy/nginx/adwaresource.conf /etc/nginx/sites-available/adwaresource
#   sudo ln -sf /etc/nginx/sites-available/adwaresource /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL แนะนำ: Cloudflare Origin Certificate → deploy/nginx/ssl/
#   Cloudflare → SSL/TLS → Origin Server → Create Certificate
#   วาง origin.pem + origin-key.pem แล้ว uncomment block listen 443 ด้านล่าง

map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name adwaresource.co.th www.adwaresource.co.th;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }
}

